name: Update parent repo

on:
  workflow_call:
    inputs:
      target_repo:
        description: Repository containing the submodule, in owner/repo format.
        type: string
        required: true
      target_submodule:
        description: Path of the submodule in the target repository.
        type: string
        required: true
      target_branch:
        description: Branch in the target repository to update. Created if it does not exist using the default branch.
        type: string
        required: true
    secrets:
      _GITHUB_TOKEN_SUBMODULE_SYNC:
        description: PAT with write access to the target repo.
        required: true

permissions:
  contents: read

jobs:
  sync:
    name: Update parent repo
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ secrets._GITHUB_TOKEN_SUBMODULE_SYNC }}
          submodules: false
          lfs: false

      - name: Select target branch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          if (git ls-remote --heads origin "refs/heads/${{ inputs.target_branch }}") {
            git fetch --depth 1 origin "${{ inputs.target_branch }}"
            git checkout -B "${{ inputs.target_branch }}" FETCH_HEAD
          }
          else {
            Write-Host "Branch '${{ inputs.target_branch }}' does not exist in target repo, creating it"
            git checkout -b "${{ inputs.target_branch }}"
          }

      - name: Update submodule reference
        run: git update-index --cacheinfo 160000,${{ github.sha }},${{ inputs.target_submodule }}

      - name: Show git status
        run: git status

      - name: Commit and push if necessary
        shell: pwsh
        env:
          SOURCE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          if (-not (git status --porcelain)) {
            Write-Host "Submodule reference is already up to date"
            exit 0
          }

          $sourceContext = ($env:SOURCE_COMMIT_MESSAGE -split "`n")[0].Trim()
          if ($sourceContext) {
            $sourceContext = "`"$sourceContext`" (${{ github.sha }})"
          }
          else {
            $sourceContext = "${{ github.sha }}"
          }
          
          $commitMessage = "Update ${{ inputs.target_submodule }} for $sourceContext"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m $commitMessage
          git push origin "HEAD:refs/heads/${{ inputs.target_branch }}"
